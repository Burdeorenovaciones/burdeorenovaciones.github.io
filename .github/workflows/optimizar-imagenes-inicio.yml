name: Optimizar imágenes de Inicio

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/optimizar-imagenes-inicio.yml
      - .github/scripts/optimize_homepage.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout de main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow para conversión WebP
        run: python -m pip install 'Pillow>=11,<13'

      - name: Generar imágenes y actualizar Inicio
        run: python .github/scripts/optimize_homepage.py

      - name: Comprobar archivos resultantes
        run: |
          test -s img/optimizadas/manifest.json
          test -s img/optimizadas/logo-burdeo-512.webp
          grep -q 'srcset="img/optimizadas/' index.html
          git diff --check

      - name: Publicar imágenes optimizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html img/optimizadas/
          if ! git diff --cached --quiet; then
            git commit -m "Optimizar imágenes Inicio WebP responsive [skip ci]"
            git push origin HEAD:main
          fi
