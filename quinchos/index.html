<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestros Quinchos | Burdeo Renovaciones</title>
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos simples y limpios */
        :root { --burdeo: #800020; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; }
        .header { text-align: center; padding: 50px 20px; background: #1a1a1a; color: white; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin: 0; }
        .header p { color: #ccc; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 50px 20px; }
        
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; }
        
        .card { border-radius: 8px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card-body { padding: 20px; }
        .card-body h3 { margin: 0 0 10px; color: var(--burdeo); font-family: 'Playfair Display', serif; }
        .btn { display: inline-block; text-decoration: none; color: #333; font-weight: 600; margin-top: 10px; }
        
        .back-home { display: block; text-align: center; margin-top: 50px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Nuestros Quinchos</h1>
        <p>Espacios creados para compartir el calor del sur</p>
    </div>

    <div class="container">
        <div class="projects-grid">
            
            <div class="card">
                <a href="proyecto-1.html">
                    <img src="../img/quinchos/proyecto-1/portada.webp" alt="Quincho 1">
                    <div class="card-body">
                        <h3>Quincho Puerto Varas</h3>
                        <p>Madera nativa, parrilla en obra y espacio lounge.</p>
                        <span class="btn">Ver Proyecto &rarr;</span>
                    </div>
                </a>
            </div>

            </div>

        <a href="../index.html" class="back-home">&larr; Volver al Inicio</a>
    </div>

</body>
</html>
