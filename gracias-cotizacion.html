<head>

  <style>
    :root{--burdeo:#800020;--crema:#f7f2ec;--texto:#2d2b2b}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Montserrat',sans-serif;color:var(--texto);background:linear-gradient(rgba(247,242,236,.93),rgba(247,242,236,.93)),url('img/cocinas/frutillar/cocina-frutillar-portada.jpg') center/cover fixed;min-height:100vh;display:grid;place-items:center;padding:24px}

    .logo{height:92px;margin-bottom:22px}
    .icon{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:0 auto 22px;background:#f7e8e9;color:var(--burdeo);font-size:1.8rem}
    h1{font-family:'Playfair Display',serif;color:var(--burdeo);font-size:2.6rem;margin:0 0 14px}
    p{line-height:1.65;color:#665f5a;margin:0 auto 20px;max-width:540px}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
    a{display:inline-flex;align-items:center;gap:9px;padding:13px 19px;border-radius:9px;text-decoration:none;font-weight:700;font-size:.9rem}
    .primary{background:var(--burdeo);color:#fff}
    .secondary{border:1px solid #d9cec5;color:var(--texto);background:#fff}

<body>

    <img class="logo" src="img/LOGO BURDEO.png" alt="Burdeo Renovaciones">
    <div class="icon"><i class="fas fa-check"></i></div>
    <h1>¡Gracias por tu solicitud!</h1>
    <p id="mensaje">Recibimos los antecedentes de tu proyecto. Revisa la pestaña de WhatsApp que acabamos de abrir y envíanos el mensaje para continuar con la cotización.</p>
    <div class="actions">

      <a class="secondary" href="index.html"><i class="fas fa-house"></i> Volver al inicio</a>

    <div class="small">Burdeo Renovaciones · Diseño · fabricación · instalación</div>

  <script>
    const nombre = sessionStorage.getItem('burdeo_quote_name');
    if (nombre) {
      document.getElementById('mensaje').textContent =
        'Gracias, ' + nombre + '. Recibimos los antecedentes de tu proyecto. Revisa la pestaña de WhatsApp que acabamos de abrir y envíanos el mensaje para continuar con la cotización.';
